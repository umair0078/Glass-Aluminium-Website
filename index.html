        function App() {
            useEffect(() => {
                const observerOptions = {
                    threshold: 0.05, // Lower threshold triggers animation sooner
                    rootMargin: "0px 0px -10% 0px" // Triggers when 10% from the bottom of viewport
                };

                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('active');
                            // Optionally stop observing once active
                            // observer.unobserve(entry.target);
                        }
                    });
                }, observerOptions);

                const revealElements = document.querySelectorAll('.reveal, .reveal-scale, .reveal-left');
                revealElements.forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, []);

            return (

                    <div className="reveal"><AboutSection /></div>
